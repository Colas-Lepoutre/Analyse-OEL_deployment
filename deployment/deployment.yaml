apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyse-oel-deployment
  labels:
    app: analyse-oel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyse-oel
  template:
    metadata:
      labels:
        app: analyse-oel
    spec:
      containers:
      - name: analyse-oel
        image: colaslepoutre/analyse-oel:sha-139b499
        ports:
        - containerPort: 8000
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: access_key
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-secret
              key: secret_key
