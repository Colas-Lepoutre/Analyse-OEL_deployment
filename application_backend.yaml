apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analyse-oel-backend
spec:
  project: default
  source:
    repoURL: https://github.com/Colas-Lepoutre/Analyse-OEL_deployment.git
    targetRevision: main
    path: deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: projet-jocas-dev
  syncPolicy:
    automated:
      selfHeal: true
